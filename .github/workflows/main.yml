name: Node.js CI/CD

on:
  push:
    branches: [ 11octbackend ]  # Changed to your branch
  pull_request:
    branches: [ 11octbackend ]  # Changed to your branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
       node-version: '20.x'
        
    - name: Install dependencies
      run: npm ci
      # Add deployment step
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_TELEGRAM }}
        username: ${{ secrets.EC2_USERNAME_TELEGRAM }}
        key: ${{ secrets.EC2_SSH_KEY_TELEGRAM }}
        script: |
          cd ~/decimaltelegrambot
          git pull origin 11octbackend
          npm install
          pm2 restart telegrambot || pm2 start app.js --name telegrambot