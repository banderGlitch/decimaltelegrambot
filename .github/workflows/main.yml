name: Node.js CI/CD

on:
  push:
    branches: [ 11octbackend ]  # Changed to your branch
  pull_request:
    branches: [ 11octbackend ]  # Changed to your branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
        
    - name: Install dependencies
      run: npm ci